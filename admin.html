.off{opacity:.5}

.pbar{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));padding:0 16px;z-index:35;animation:rise .35s var(--e)}.pbar .btn{max-width:600px;margin:0 auto;box-shadow:0 14px 30px -8px rgba(255,106,0,.7)}
.back{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.back.open{display:flex;animation:fd .22s}.back.open .sheet{animation:up .34s var(--e)}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet{background:linear-gradient(180deg,#1f1f25,#16161a);border:1px solid var(--l);border-bottom:0;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom));position:relative}

.neu{border-color:rgba(255,106,0,.6)!important;box-shadow:0 0 0 1px rgba(255,106,0,.3),0 0 34px -8px rgba(255,106,0,.55)!important}
.chp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chp .btn{min-height:38px;padding:0 13px;font-size:13px}
.oh{display:flex;align-items:center;gap:10px;cursor:pointer}.oh .n{flex:1;min-width:0}.oh b{font-weight:700}
.clk{font-weight:800;font-variant-numeric:tabular-nums;padding:7px 11px;border-radius:11px;color:#fff;font-size:15px;background:#2a6}.clk.late{animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
.chev{color:var(--m);font-size:11px}
.spin{width:30px;height:30px;border:3px solid var(--l);border-top-color:var(--o);border-radius:50%;margin:70px auto;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.login{text-align:center;margin-top:8vh;padding:26px 18px}.login img{width:76px;height:76px;border-radius:22px;box-shadow:0 14px 30px -10px rgba(255,106,0,.7)}.login h2{margin:14px 0 2px;font-size:22px;letter-spacing:-.02em}.login label{text-align:left}
a{color:var(--o2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;display:block;width:46px;min-width:46px;max-width:46px;height:28px;min-height:28px;margin:0;padding:0;flex:none;border-radius:99px;background:#3a3a42;border:0;position:relative;touch-action:manipulation}
input[type=checkbox].sw:checked{background:var(--ok)}
input[type=checkbox].sw::after{top:3px;left:3px;width:22px;height:22px}input[type=checkbox].sw:checked::after{transform:translateX(18px)}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}.mv button{width:34px;height:24px;border-radius:8px;border:1px solid var(--l);background:var(--s2);color:var(--m);font-size:10px;padding:0}
.row .n,.row .th{cursor:pointer}
input,select,textarea{font-size:16px}html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:var(--s2);border:1px solid var(--l);color:var(--m);font-weight:700;font-size:13px}
.seg button.on{background:rgba(255,106,0,.18);border-color:rgba(255,106,0,.5);color:#fff}.seg i{font-style:normal;background:var(--o);color:#1a0d00;border-radius:99px;min-width:20px;height:20px;line-height:20px;font-size:11px;padding:0 6px}
.oc{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--l);border-left:5px solid var(--m);border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer}
.oc.st-novo{border-left-color:var(--o)}.oc.st-preparo{border-left-color:#60a5fa}.oc.st-entrega{border-left-color:#a78bfa}.oc.st-entregue{border-left-color:var(--ok)}.oc.st-cancelado{border-left-color:var(--bad)}
.o1{display:flex;align-items:center;gap:8px}.o1 b{font-size:17px}.o1 span:nth-child(2){flex:1;color:var(--m);font-size:12px}
.o2{margin:6px 0 2px;font-weight:600}.o3{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:13px}.o3 b{color:var(--t);font-size:17px}
.blk{padding:12px 0;border-top:1px solid var(--l)}.blk>b{display:block;margin-bottom:6px;font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.07em}
.it{padding:3px 0}.it small{display:block;color:var(--o2)}.tot{font-size:20px;font-weight:800;margin-top:6px}
a.btn{color:var(--t);text-decoration:none}.big{min-height:56px;font-size:16px}
#nov{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:70;display:none;justify-content:center;pointer-events:none}
#nov.on{display:flex;animation:fd .2s}#nov .nv{pointer-events:auto;width:100%;max-width:560px;background:linear-gradient(180deg,#25252c,#1a1a1f);border:1px solid rgba(255,106,0,.55);border-radius:20px;padding:14px;box-shadow:0 18px 40px -12px #000}#nov .nvh{display:flex;align-items:flex-start;gap:10px}#nov .nvh .n{flex:1;min-width:0}#nov .nvh b{display:block;font-weight:750}#nov .nvh small{display:block;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#nov .nvb{display:flex;gap:8px;margin-top:12px}#nov .nvb .btn{flex:1;margin:0}

[data-sort]{position:relative}

/* ===== Acabamento visual (somente tela) ===== */
@media screen{
:root{--e2:cubic-bezier(.32,.72,0,1);--r:20px;--ring:0 0 0 4px rgba(255,106,0,.18)}
html{scroll-behavior:smooth}
body{letter-spacing:-.005em;font-feature-settings:"cv11","ss01";text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(255,106,0,.35)}
.top{border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 10px 30px -22px #000}
h1{font-size:23px;letter-spacing:-.03em}.sub{letter-spacing:0}
.pill{background:rgba(255,255,255,.04);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.card{border-radius:var(--r);border-color:rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),var(--s1);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -26px #000;transition:border-color .3s var(--e2),box-shadow .3s var(--e2)}
h3{letter-spacing:-.01em}
label{letter-spacing:.03em;text-transform:none}
input,select,textarea{border-radius:14px;background:rgba(255,255,255,.035);transition:border-color .25s var(--e2),box-shadow .25s var(--e2),background .25s var(--e2)}
input:hover,select:hover,textarea:hover{border-color:rgba(255,255,255,.16)}
input:focus,select:focus,textarea:focus{box-shadow:var(--ring)}
.btn{border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border-color:rgba(255,255,255,.09);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;transition:transform .2s var(--e2),background .25s,box-shadow .25s,border-color .25s,opacity .2s}
.btn:hover{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border-color:rgba(255,255,255,.16)}
.btn:active{transform:scale(.975)}
.btn:focus-visible,.seg button:focus-visible,.nav button:focus-visible{outline:2px solid var(--o2);outline-offset:2px}
.pri{background:linear-gradient(180deg,#ffa05a,var(--o) 70%,#f25f00);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 26px -12px rgba(255,106,0,.85)}
.pri:hover{background:linear-gradient(180deg,#ffb078,#ff7410 70%,#f56400);transform:translateY(-1px)}
.pri:active{transform:scale(.975)}
.danger{background:rgba(255,93,82,.06);border-color:rgba(255,93,82,.22)}.danger:hover{background:rgba(255,93,82,.12)}
.seg button{transition:background .25s var(--e2),color .25s,border-color .25s,transform .2s var(--e2)}
.seg button.on{box-shadow:0 8px 20px -12px rgba(255,106,0,.7)}
.oc{border-radius:var(--r);border-color:rgba(255,255,255,.07);border-left-width:4px;padding:15px 16px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 36px -26px #000;transition:transform .28s var(--e2),box-shadow .28s var(--e2),border-color .28s}
.oc:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 22px 44px -24px #000}
.oc:active{transform:scale(.99)}
.o1 b{font-size:18px;letter-spacing:-.02em}
.o1 span:nth-child(2){font-weight:600;letter-spacing:.01em}
.o2{font-size:15px;letter-spacing:-.01em}
.clk{border-radius:10px;box-shadow:0 6px 16px -8px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.2) inset}
.row{transition:background .2s}
.th{border-radius:14px;box-shadow:0 6px 16px -10px #000}

.nav button{transition:color .25s,background .3s var(--e2),transform .2s var(--e2)}

.nav button.on{background:linear-gradient(180deg,rgba(255,106,0,.26),rgba(255,106,0,.12));box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.back{background:rgba(4,4,6,.66);backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2)}
.back.open .sheet{animation:up .46s var(--e2)}
.sheet{border-radius:30px 30px 0 0;border-color:rgba(255,255,255,.09);background:linear-gradient(180deg,#212128,#15151a);box-shadow:0 -24px 60px -20px #000}
.blk{border-top-color:rgba(255,255,255,.07);padding:14px 0}
.blk>b{letter-spacing:.09em}
.tot{letter-spacing:-.02em}
.toast{border-radius:16px;box-shadow:0 18px 40px -12px #000,0 0 0 1px rgba(0,0,0,.06)}

.pbar .btn{box-shadow:0 18px 36px -12px rgba(255,106,0,.75)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.995)}}
@keyframes up{from{transform:translateY(70px);opacity:0}}

}

<script>
/* Trava a rolagem do fundo enquanto houver uma tela aberta (sacola, item, Pix, painel) */
(function () {
  var SEL = '.page.open,.sheet-back.open,.back.open', b = document.body, h = document.documentElement, on = false, y = 0, sy = 0;
  function sync() {
    var any = !!document.querySelector(SEL);
    if (any && !on) {
      on = true; y = window.pageYOffset || h.scrollTop || 0;
      var sw = window.innerWidth - h.clientWidth;
      b.style.top = -y + 'px'; if (sw > 0) b.style.paddingRight = sw + 'px';
      b.classList.add('locked'); h.classList.add('locked');
    } else if (!any && on) {
      on = false; b.classList.remove('locked'); h.classList.remove('locked');
      b.style.top = ''; b.style.paddingRight = '';
      window.scrollTo({ top: y, left: 0, behavior: 'instant' });
    }
  }
  new MutationObserver(sync).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
  document.addEventListener('touchstart', function (e) { sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!on || e.touches.length > 1) return;
    var n = e.target;
    while (n && n !== b && n !== h) {
      if (n.nodeType === 1 && n.scrollHeight > n.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(n).overflowY)) break;
      n = n.parentNode;
    }
    if (!n || n === b || n === h) return e.preventDefault();
    var dy = e.touches[0].clientY - sy;
    if ((dy > 0 && n.scrollTop <= 0) || (dy < 0 && n.scrollTop + n.clientHeight >= n.scrollHeight - 1)) e.preventDefault();
  }, { passive: false });
  sync();
})();
</script>
