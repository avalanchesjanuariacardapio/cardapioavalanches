<style>

.row .n{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.row small,.oh small{display:block;color:var(--o2);font-size:12.5px}
.th{width:58px;height:58px;border-radius:15px;background:#222 center/cover;flex:none;border:1px solid var(--l)}
.off{opacity:.5}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;min-height:0;margin:0;padding:0;border-radius:99px;background:#3a3a42;position:relative;border:0;flex:none;transition:background .25s}
.sw:checked{background:var(--ok)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .25s var(--e)}.sw:checked::after{transform:translateX(20px)}

.bd{position:absolute;top:3px;right:18%;background:var(--bad);color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:11px;line-height:18px;padding:0 5px;font-weight:700;animation:pop .3s var(--e)}

.back.open{display:flex;animation:fd .22s}.back.open .sheet{animation:up .34s var(--e)}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet{background:linear-gradient(180deg,#1f1f25,#16161a);border:1px solid var(--l);border-bottom:0;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom));position:relative}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin:-10px auto 14px}
.pic{width:100%;height:190px;border-radius:18px;background:#222 center/cover;display:flex;align-items:center;justify-content:center;color:var(--m);margin-bottom:10px;overflow:hidden;border:1px solid var(--l)}.pic img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.96);color:#111;font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px;z-index:99;box-shadow:0 14px 34px -10px #000;animation:tin .35s var(--e);max-width:90vw}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}}
.neu{border-color:rgba(255,106,0,.6)!important;box-shadow:0 0 0 1px rgba(255,106,0,.3),0 0 34px -8px rgba(255,106,0,.55)!important}
.chp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chp .btn{min-height:38px;padding:0 13px;font-size:13px}
.oh{display:flex;align-items:center;gap:10px;cursor:pointer}.oh .n{flex:1;min-width:0}.oh b{font-weight:700}
.clk{font-weight:800;font-variant-numeric:tabular-nums;padding:7px 11px;border-radius:11px;color:#fff;font-size:15px;background:#2a6}.clk.late{animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
.chev{color:var(--m);font-size:11px}
.spin{width:30px;height:30px;border:3px solid var(--l);border-top-color:var(--o);border-radius:50%;margin:70px auto;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.login{text-align:center;margin-top:8vh;padding:26px 18px}.login img{width:76px;height:76px;border-radius:22px;box-shadow:0 14px 30px -10px rgba(255,106,0,.7)}.login h2{margin:14px 0 2px;font-size:22px;letter-spacing:-.02em}.login label{text-align:left}
a{color:var(--o2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;display:block;width:46px;min-width:46px;max-width:46px;height:28px;min-height:28px;margin:0;padding:0;flex:none;border-radius:99px;background:#3a3a42;border:0;position:relative;touch-action:manipulation}
input[type=checkbox].sw:checked{background:var(--ok)}
input[type=checkbox].sw::after{top:3px;left:3px;width:22px;height:22px}input[type=checkbox].sw:checked::after{transform:translateX(18px)}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}.mv button{width:34px;height:24px;border-radius:8px;border:1px solid var(--l);background:var(--s2);color:var(--m);font-size:10px;padding:0}
.row .n,.row .th{cursor:pointer}
input,select,textarea{font-size:16px}html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}

let tab='pedidos',draft=null,dirty=!!localStorage.getItem('avl_dirty'),user=null,PH={},ORD=[],NEWC=0,CUP=[],cd=null,unsub=null,PRAZO=40,OPENO=new Set();

const TABS=[['pedidos',`<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>`,'Pedidos'],['menu',`<svg viewBox="0 0 24 24"><path d="M4 11a8 6 0 0 1 16 0z"/><path d="M3 14.5h18"/><path d="M5 18h14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/></svg>`,'Cardápio'],['cup',`<svg viewBox="0 0 24 24"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>`,'Cupons'],['add',`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`,'Extras'],['loja',`<svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/></svg>`,'Loja'],['pub',`<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>`,'Publicar']];
function nav(){$('pubbar').innerHTML=dirty&&tab!='pub'?'<button class="btn pri full" data-a="publish">🚀 Publicar mudanças</button>':'';document.querySelector('nav').style.display='';$('nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab==t[0]?'on':''}${t[0]=='pub'&&dirty?' dot':''}"><b>${t[1]}</b>${t[2]}${t[0]=='pedidos'&&NEWC?'<span class="bd">'+NEWC+'</span>':''}</button>`).join('')}

 im.onload=()=>{nw=im.naturalWidth;nh=im.naturalHeight;fw=cv.clientWidth;fh=cv.clientHeight;b=Math.max(fw/nw,fh/nh);sc=b;x=(fw-nw*sc)/2;y=(fh-nh*sc)/2;draw()};

let AC=null;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC}
function ring(){const a=audio();if(!a)return;const comp=a.createDynamicsCompressor();comp.connect(a.destination);const t0=a.currentTime+.05;
 for(let i=0;i<10;i++){const o=a.createOscillator(),g=a.createGain(),st=t0+i*.2;o.type='square';o.frequency.value=i%2?1100:1700;o.connect(g);g.connect(comp);
  g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(1,st+.01);g.gain.setValueAtTime(1,st+.14);g.gain.linearRampToValueAtTime(0,st+.18);o.start(st);o.stop(st+.19)}
 navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}
function alertNew(){ring();toast('🔔 Novo pedido!')}
setInterval(()=>{if(NEWC>0&&AC&&AC.state=='running')ring()},4500);
async function wl(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('pointerdown',()=>{audio();wl()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()});
let lastTab='';
const TT={pedidos:'Pedidos',menu:'Cardápio',cup:'Cupons',add:'Extras',loja:'Minha loja',pub:'Publicar'};
const SUB={pedidos:'Acompanhe e despache em tempo real',menu:'Itens, preços, fotos e disponibilidade',cup:'Crie descontos para atrair clientes',add:'Adicionais que o cliente pode escolher',loja:'Perfil, horários e dados de contato',pub:'Envie suas mudanças para o site'};
function openNow(){const L=D.loja,h=new Date().getHours(),a=+L.open,c=+L.close;return L.modo=='aberto'?true:L.modo=='fechado'?false:(a<c?(h>=a&&h<c):(h>=a||h<c))}
function chrome(){$('ttl').textContent=TT[tab]||'';$('hs').textContent=SUB[tab]||'';const o=openNow();$('live').innerHTML='<span class="pill'+(o?'':' off')+'"><i></i>'+(o?'Loja aberta':'Loja fechada')+'</span>';
 if(lastTab!=tab){lastTab=tab;const m=$('main');m.classList.remove('in');void m.offsetWidth;m.classList.add('in');clearTimeout(window._ti);window._ti=setTimeout(()=>m.classList.remove('in'),800);window.scrollTo&&window.scrollTo(0,0)}}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&$('pw')&&document.activeElement==$('pw')){const b=document.querySelector('[data-a=login]');b&&b.click()}});
async function pull(){
 if(!dirty){try{const x=await getDoc(doc(db,'cardapio','config'));if(x.exists()){D=JSON.parse(x.data().json);D.addons=D.addons||[]}else dirty=true}catch(e){toast('Sem conexão com a nuvem')}}
 try{const x=await getDoc(doc(db,'cardapio','ao_vivo'));if(x.exists())PRAZO=+x.data().prazo||40}catch(e){}
 try{const x=await getDocs(collection(db,'cupons'));CUP=x.docs.map(y=>{try{return {code:y.id,...JSON.parse(y.data().json)}}catch(e){return null}}).filter(Boolean)}catch(e){}
 await Promise.all([...D.items,{id:'_perfil',image:D.loja.perfil},{id:'_capa',image:D.loja.capa}].filter(i=>(i.image||'').startsWith('cloud:')&&!PH[i.id]).map(async i=>{try{const x=await getDoc(doc(db,'fotos',i.id));if(x.exists())PH[i.id]=x.data().d}catch(e){}}))}
async function publish(){
 const b=document.querySelector('[data-a=publish]');if(b){b.disabled=true;b.textContent='Publicando…'}
 try{const out=JSON.parse(JSON.stringify(D));
  for(let i=0;i<D.items.length;i++){const it=D.items[i];if((it.image||'').startsWith('data:')){const v=Date.now().toString(36)+i;await setDoc(doc(db,'fotos',it.id),{d:it.image,v});PH[it.id]=it.image;it.image='cloud:'+v;out.items[i].image=it.image}}
  for(const k of ['perfil','capa']){const v0=D.loja[k];if((v0||'').startsWith('data:')){const v=Date.now().toString(36)+k;await setDoc(doc(db,'fotos','_'+k),{d:v0,v});PH['_'+k]=v0;D.loja[k]='cloud:'+v;out.loja[k]=D.loja[k]}}
  await setDoc(doc(db,'cardapio','config'),{json:JSON.stringify(out)});
  dirty=false;localStorage.removeItem('avl_dirty');try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}toast('Publicado! Já está no ar.')
 }catch(e){toast('Erro ao publicar: '+(e.code||e.message))}
 view()}

if(!ok){document.querySelector('nav').style.display='none';$('main').innerHTML='<div class="card"><h3>Falta configurar</h3><p class="sub">Cole os dados do seu projeto Firebase no começo do arquivo admin.html (onde está COLE_AQUI).</p></div>'}
else onAuthStateChanged(auth,async u=>{user=u;if(!u){if(unsub){unsub();unsub=null}ORD=[];NEWC=0;login();return}$('main').innerHTML='<div class="spin"></div>';await pull();listen();view()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
