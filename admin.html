<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Painel do Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.enmap{height:230px;border-radius:14px;overflow:hidden;border:1px solid var(--l);background:var(--s2);margin:8px 0 12px;position:relative;z-index:0;isolation:isolate}
.enmap.mini{height:170px}
.enmap .leaflet-container{z-index:0}
.enrow .n{cursor:pointer}
.enchk{display:flex;align-items:center;gap:9px;margin:12px 0;font-weight:500;line-height:1.35}
.enchk input{width:18px;height:18px;margin:0;accent-color:var(--o);flex:none}
.leaflet-bar a{background:var(--s1)!important;color:var(--t)!important;border-color:var(--l)!important}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#bbb!important;font-size:9px!important}
.leaflet-control-attribution a{color:#ddd!important}
</style>
<link rel="manifest" href="admin.webmanifest"><link rel="icon" type="image/png" href="logo-app.png"><link rel="apple-touch-icon" href="logo-app.png"><meta name="theme-color" content="#0b0b0c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Painel">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('avl_theme')==='light'?'light':'dark'}catch(e){}</script>
<style>
:root{color-scheme:dark;--o:#ff6a00;--o2:#ffa04d;--bg:#0a0a0c;--s1:#121216;--s2:#1b1b21;--s3:#25252c;
 --l:rgba(255,255,255,.08);--l2:rgba(255,255,255,.14);--t:#f7f5f2;--m:#918c85;
 --ok:#34d399;--ok2:#1c8a63;--bad:#ff5d52;--warn:#fbbf24;--info:#60a5fa;
 --r:18px;--rs:13px;--sh:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -26px #000;
 --e:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100dvh}
html{scroll-behavior:smooth;scrollbar-color:rgba(255,255,255,.15) transparent;scrollbar-width:thin}
body{margin:0;color:var(--t);font:14.5px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 background:radial-gradient(900px 430px at 88% -12%,rgba(255,106,0,.14),transparent 62%),var(--bg);
 overflow-x:hidden;overscroll-behavior:none;overscroll-behavior-y:none;-webkit-overflow-scrolling:auto;
 -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
html.locked,body.locked{overflow:hidden;overscroll-behavior:none;overscroll-behavior-y:none}
body.locked{position:fixed!important;left:0;right:0;width:100%}
body>*{position:relative}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;z-index:120;
 display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;border:0;background:none;transition:transform .24s var(--e),background .26s,border-color .26s,opacity .24s}
button:active{transform:scale(.975)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--o2);outline-offset:2px}
a{color:var(--o2)}
::selection{background:rgba(255,106,0,.35)}

/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;
 padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
 background:rgba(10,10,12,.82);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
 border-bottom:1px solid var(--l)}
.top>.ttlbox{flex:1;min-width:0}
.topback{display:none;align-items:center;justify-content:center;width:36px;height:36px;min-height:36px;flex:none;
 border:0;border-radius:0;color:var(--t);background:none;box-shadow:none}
.topback svg{width:20px;height:20px}
.dots{display:none;align-items:center;justify-content:center;width:38px;height:38px;min-height:38px;flex:none;
 border:0;border-radius:0;color:var(--t);background:none;box-shadow:none}
.dots svg{width:22px;height:22px;fill:none;stroke:none}
.dots svg circle{fill:currentColor}
.dots.on{color:var(--o2);background:none;border:0;box-shadow:none}
.topback:active,.dots:active,.btn.ic:active{transform:none}
h1{font-size:20px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.15}
.sub{font-size:12.5px;color:var(--m);margin:2px 0 0}
#live{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:33px;padding:6px 12px;border-radius:99px;
 background:rgba(255,255,255,.05);border:1px solid var(--l);font-size:11.5px;font-weight:700;white-space:nowrap}
.pill i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;
 animation:statusPulse 2.4s ease-out infinite}
.pill i::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:statusRing 2.4s ease-out infinite}
.pill.off{color:var(--m)}
.pill.off i,.pill.off i::after{background:#ff827a;animation:none;box-shadow:none}
@keyframes statusPulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}50%{box-shadow:0 0 0 5px rgba(52,211,153,0)}}
@keyframes statusRing{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}
.status-mini{display:inline-flex;align-items:center;gap:6px;color:var(--ok)}
.status-mini i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:statusPulse 2.4s ease-out infinite}
.status-mini.off{color:var(--m)}.status-mini.off i{animation:none}
.avatar{display:none;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#2b2b34,#1b1b21);border:1px solid var(--l2);color:var(--o2);font-weight:800;font-size:13px}

/* ---------- Barra de atalhos (mobile) ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:stretch;
 padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--l);
 background:rgba(12,12,15,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 min-height:52px;padding:4px 0;color:var(--m);font-size:10px;font-weight:650;letter-spacing:0;border-radius:12px;
 transition:color .24s var(--e),background .24s var(--e)}
.nav button svg{width:21px;height:21px;flex:none}
.nav button.on{color:var(--o2);background:rgba(255,106,0,.1)}
.nav button:not(.on):hover{background:rgba(255,255,255,.05)}
.nav .bd{position:absolute;top:2px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;
 background:linear-gradient(135deg,#ff827a,var(--bad));color:#fff;font-size:9px;line-height:16px;font-weight:700}
[data-theme="light"] .nav{background:rgba(255,255,255,.95)}
[data-theme="light"] .nav button:not(.on):hover{background:rgba(15,23,42,.05)}

/* ---------- Conteúdo ---------- */
.wrap{max-width:600px;margin:0 auto;padding:16px 14px calc(86px + env(safe-area-inset-bottom))}
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.995)}}
.card{background:linear-gradient(155deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--s1);
 border:1px solid var(--l);border-radius:var(--r);padding:16px;margin-bottom:13px;box-shadow:var(--sh)}
.card>.sub:only-child{text-align:center;padding:18px 8px;margin:0}
h3{margin:0 0 12px;font-size:14px;font-weight:750;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
h3::before{content:"";width:3px;height:15px;border-radius:3px;background:linear-gradient(var(--o2),var(--o));flex:none}
label{display:block;font-size:11.5px;font-weight:650;color:var(--m);letter-spacing:.03em;margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px 13px;min-height:48px;border-radius:var(--rs);
 border:1px solid var(--l);background:rgba(255,255,255,.04);font-size:15px;color:var(--t);
 transition:border-color .22s,box-shadow .22s,background .22s}
input::placeholder,textarea::placeholder{color:#6f6b66}
input:hover:not(:focus),select:hover:not(:focus),textarea:hover:not(:focus){border-color:var(--l2)}
input:focus,select:focus,textarea:focus{outline:0;border-color:rgba(255,106,0,.65);box-shadow:0 0 0 4px rgba(255,106,0,.14);background:rgba(255,255,255,.055)}
select option{color:#111}
input[type=range]{padding:0;min-height:30px;accent-color:var(--o);border:0;background:none}
input[type=checkbox]{width:auto;min-height:0;margin:0;padding:0;display:inline-block;accent-color:var(--o)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two>*{min-width:0}
.chk{display:flex;align-items:center;gap:10px;color:var(--t);font-size:13px;font-weight:500;letter-spacing:0}
.chk input{width:20px;height:20px}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;
 border-radius:var(--rs);font-size:13.5px;font-weight:700;border:1px solid var(--l);
 background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.btn:hover{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border-color:var(--l2);transform:translateY(-1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.full{display:flex;width:100%;margin-top:8px}
.btn.big{min-height:56px;font-size:15px}
.btn.ic{width:40px;min-height:40px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;flex:none}
.btn.ic:hover{background:none;border:0;box-shadow:none;transform:none;opacity:.7}
.btn.ic svg{width:20px;height:20px}
.pri{background:linear-gradient(180deg,#ffa766,#ff6a00 72%,#e85c00);color:#1a0d00;border:0;
 box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 24px -12px rgba(255,106,0,.9)}
.pri:hover{background:linear-gradient(180deg,#ffb57d,#ff7a1a 72%,#f06400)}
.danger{color:#ff827a;background:rgba(255,93,82,.07);border-color:rgba(255,93,82,.24)}
.danger:hover{background:rgba(255,93,82,.14);border-color:rgba(255,93,82,.4)}
.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.btn .ico{margin-right:2px}
.btn.pri .ico{stroke:#1a0d00}
.chp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chp .btn{min-height:38px;padding:0 13px;font-size:13px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 1 auto;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 10px;border-radius:99px;
 background:var(--s2);border:1px solid var(--l);color:var(--m);font-weight:700;font-size:12.5px}
.seg button.on{background:linear-gradient(180deg,rgba(255,106,0,.24),rgba(255,106,0,.1));border-color:rgba(255,106,0,.48);color:#fff}
.seg i{font-style:normal;background:linear-gradient(135deg,var(--o2),var(--o));color:#1a0d00;border-radius:99px;
 min-width:20px;height:20px;line-height:20px;font-size:11px;padding:0 6px;font-weight:800}
.sec-title{font-size:11px;font-weight:750;letter-spacing:.12em;color:var(--m);margin:20px 2px 10px;text-transform:uppercase}
.empty-line{padding:16px;text-align:center;color:var(--m);font-size:13px}

/* ---------- Listas / itens ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--l)}
.row:last-child{border:0;padding-bottom:0}.row:first-of-type{padding-top:0}
.row .n{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.row small,.oh small{display:block;color:var(--o2);font-size:12.5px}
.row .n,.row .th{cursor:pointer}
.th{width:58px;height:58px;border-radius:14px;background:#222 center/cover;flex:none;border:1px solid var(--l);box-shadow:0 6px 16px -10px #000}
.off{opacity:.5}
.sw{appearance:none;-webkit-appearance:none;display:block;width:46px;min-width:46px;max-width:46px;height:28px;min-height:28px;
 margin:0;padding:0;border-radius:99px;background:#3a3a42;border:0;position:relative;flex:none;transition:background .25s;touch-action:manipulation}
.sw:checked{background:var(--ok)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
 box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .3s var(--e)}
.sw:checked::after{transform:translateX(18px)}
.hd{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;width:30px;height:48px;display:flex;
 align-items:center;justify-content:center;color:var(--m);flex:none;margin-left:-8px}
.hd svg{fill:currentColor}
.row.drag{position:relative;z-index:20;background:#26262d;border-radius:16px;padding-left:10px;padding-right:10px;
 border-bottom:0;box-shadow:0 20px 44px -10px #000,0 0 0 1.5px var(--o)}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}
.mv button{width:34px;height:24px;border-radius:8px;border:1px solid var(--l);background:var(--s2);color:var(--m);font-size:10px;padding:0}
.pixkey{background:rgba(255,255,255,.05);border:1px dashed var(--l2);border-radius:12px;padding:12px;font-size:13px;
 font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}

/* ---------- Início ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 16px}
.hello h2{font-size:23px;font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.15}
.hello p{margin:5px 0 0;color:var(--m);font-size:12.5px;font-weight:650}
.lojadot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;
 background:var(--bad);animation:lojaVermelho 1.7s ease-out infinite}
.lojadot.on{background:var(--ok);animation:lojaVerde 1.7s ease-out infinite}
@keyframes lojaVermelho{0%{box-shadow:0 0 0 0 rgba(217,56,45,.6)}100%{box-shadow:0 0 0 8px rgba(217,56,45,0)}}
@keyframes lojaVerde{0%{box-shadow:0 0 0 0 rgba(15,157,110,.6)}100%{box-shadow:0 0 0 8px rgba(15,157,110,0)}}
.hello .dia{text-align:right;color:var(--m);font-size:11.5px;line-height:1.5;flex:none}
.hello .dia b{display:block;font-size:13px;font-weight:700;letter-spacing:-.02em}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.kp>div{background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),var(--s1);
 border:1px solid var(--l);border-radius:var(--r);padding:14px;min-width:0;box-shadow:var(--sh)}
.kp .w{grid-column:1/-1}
.kp small{display:block;color:var(--m);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.kp b{display:block;font-size:23px;font-weight:800;letter-spacing:-.045em;margin-top:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kp .w b{font-size:32px;color:var(--ok)}
.it{padding:3px 0}.it small{display:block;color:var(--o2)}
.lr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--l)}
.lr:last-child{border:0}.lr small{color:var(--m)}.lr>span:first-child{min-width:0}.lr>b,.lr>span:last-child{white-space:nowrap;flex:none}
.bar2{height:6px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));box-shadow:0 0 14px -3px rgba(255,106,0,.8)}
.rk{padding:10px 0}.rk+.rk,.ro+.ro{border-top:1px solid var(--l)}.ro{padding:12px 0}
.ro[data-a]{cursor:pointer;border-radius:12px;margin:0 -8px;padding:12px 8px;transition:background .15s}
.ro[data-a]:hover{background:rgba(255,106,0,.08)}
.tot{font-size:21px;font-weight:800;letter-spacing:-.04em;margin-top:6px}
.blk{padding:13px 0;border-top:1px solid var(--l)}
.blk>b{display:block;margin-bottom:6px;font-size:10.5px;color:var(--m);font-weight:750;text-transform:uppercase;letter-spacing:.12em}

/* ---------- Pedidos ---------- */
.oc{background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--s1);
 border:1px solid var(--l);border-left:4px solid var(--m);border-radius:var(--r);padding:14px 15px;margin-bottom:12px;
 cursor:pointer;box-shadow:var(--sh);transition:transform .26s var(--e),box-shadow .26s,border-color .26s}
.oc:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 24px 46px -26px #000}
.st-novo{border-left-color:var(--o)}.st-preparo{border-left-color:#60a5fa}.st-entrega{border-left-color:#a78bfa}
.st-entregue{border-left-color:var(--ok)}.st-cancelado{border-left-color:var(--bad)}
.o1{display:flex;align-items:center;gap:8px}.o1 b{font-size:16px;font-weight:800}.o1 span:nth-child(2){flex:1;color:var(--m);font-size:12px}
.o2{margin:6px 0 2px;font-weight:600;font-size:14px}.o3{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:12.5px}
.o3 b{color:var(--t);font-size:18px;font-weight:800;letter-spacing:-.03em}
.clk{font-weight:800;font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:10px;color:#fff;font-size:14px;
 background:linear-gradient(180deg,#2a9c74,var(--ok2));box-shadow:0 6px 16px -8px #000,0 1px 0 rgba(255,255,255,.18) inset}
.clk.late{animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
.chev{color:var(--m);font-size:11px}
.spin{width:30px;height:30px;border:3px solid var(--l);border-top-color:var(--o);border-radius:50%;margin:70px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Navegação: só menu de 3 pontinhos (mobile) e sidebar (desktop) ---------- */
@keyframes pop{from{transform:scale(.3)}}
.pbar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));padding:0 14px;z-index:55;animation:riseIn .44s var(--e)}
.pbar .btn{max-width:600px;margin:0 auto;box-shadow:0 14px 30px -8px rgba(255,106,0,.7)}
.side{display:none}
.side-shade{display:none}

/* ---------- Menu "Mais" ---------- */
.msub{font-size:12px;color:var(--m);margin:-2px 0 16px}
.msec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px;padding:5px;border-radius:14px;background:var(--s2);border:1px solid var(--l)}
.msec button{min-height:42px;border:0;border-radius:10px;background:none;color:var(--m);font-size:13.5px;font-weight:750}
.msec button.on{background:rgba(255,106,0,.16);color:var(--o2);box-shadow:inset 0 0 0 1px rgba(255,106,0,.3)}
[data-theme="light"] .msec button.on{background:rgba(232,92,0,.12);color:var(--o2);box-shadow:inset 0 0 0 1px rgba(232,92,0,.25)}
.msec-anim{animation:msecIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes msecIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.appver{text-align:center;color:var(--m);font-size:11px;line-height:1.6;margin:16px 0 2px;padding-top:12px;border-top:1px solid var(--l)}
/* Atalhos em lista — sem quadrados */
.mgrid{display:flex;flex-direction:column;gap:0;margin:0 -6px}
.mgrid button{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 10px;border-radius:0;
 color:var(--t);font-size:13.5px;font-weight:650;text-align:left;transition:background .2s,color .2s,transform .2s var(--e)}
.mgrid button+button{border-top:1px solid var(--l)}
.mgrid button:hover{background:rgba(255,255,255,.045)}
.mgrid button.on{background:linear-gradient(90deg,rgba(255,106,0,.16),transparent)}

/* ---------- Sheets / modais ---------- */
.back{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;overscroll-behavior:none;
 background:rgba(4,4,6,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.back.open,.back.closing{display:flex}
.back.open{animation:fade .28s}
.back.closing{animation:fadeOut .3s var(--e) forwards}
.sheet{background:linear-gradient(165deg,#22222a,#15151a);border:1px solid var(--l);border-bottom:0;width:100%;max-width:640px;
 max-height:93dvh;overflow:auto;border-radius:26px 26px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));
 overscroll-behavior:contain;box-shadow:0 -24px 60px -20px #000}
.back.open .sheet{animation:sheetUp .46s var(--e);will-change:transform,opacity}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%);opacity:.6}}
@keyframes sheetDown{to{transform:translateY(100%);opacity:.4}}
@keyframes drawerIn{from{transform:translateX(-100%);opacity:.6}}
@keyframes drawerOut{to{transform:translateX(-100%);opacity:.4}}
.back.closing .sheet{animation:sheetDown .34s var(--e) forwards}
.back.side-mode.closing .sheet{animation:drawerOut .36s var(--e) forwards}
/* Cabeçalho unificado: voltar + título + fechar */
.shead{display:block;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid var(--l)}
.srow{display:flex;align-items:center;gap:10px;min-height:40px}
.srow .stitle{flex:1;min-width:0;font-size:15px;font-weight:750;letter-spacing:-.02em;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .msub{margin:0 0 2px}
/* Menu dos 3 pontinhos: gaveta lateral */
.back.side-mode{justify-content:flex-start;align-items:stretch}
.back.side-mode .sheet{width:min(90vw,380px);max-width:380px;height:100dvh;max-height:100dvh;
 border-radius:0;border-left:0;border-bottom:0;border-top:0;
 padding:calc(12px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
 box-shadow:30px 0 70px -20px #000}
.back.side-mode.open .sheet{animation:drawerIn .44s var(--e);will-change:transform,opacity}
/* Menu "mais": ocupa a tela inteira no celular */
.back.full{justify-content:stretch;align-items:stretch;background:rgba(4,4,6,.97);backdrop-filter:none;-webkit-backdrop-filter:none}
.back.full .sheet{width:100%;max-width:none;height:100dvh;max-height:100dvh;border:0;border-radius:0;
 padding:calc(12px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));box-shadow:none}
.back.full.open .sheet{animation:fullIn .44s var(--e);will-change:transform,opacity}
.back.full.closing .sheet{animation:fullOut .34s var(--e) forwards}
@keyframes fullIn{from{opacity:0;transform:translateY(16px)}}
@keyframes fullOut{to{opacity:0;transform:translateY(16px)}}
[data-theme="light"] .back.full{background:rgba(255,255,255,.98)}
[data-theme="light"] .back.full .sheet{background:var(--bg)}
/* Recorte: foto limitada à tela e botões sempre enquadrados */
.cropback .sheet{display:flex;flex-direction:column;max-height:100dvh;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

 padding:10px 0 2px;border-top:1px solid var(--l);background:var(--s1)}
.crop-actions .btn{margin:0;min-height:44px;font-size:13px;padding:0 10px}
[data-theme="light"] .crop-actions{background:#fff}
.pic{width:100%;height:190px;border-radius:18px;background:#222 center/cover;display:flex;align-items:center;justify-content:center;
 color:var(--m);margin-bottom:10px;overflow:hidden;border:1px solid var(--l)}

.oh{display:flex;align-items:center;gap:10px;cursor:pointer}.oh .n{flex:1;min-width:0}.oh b{font-weight:700}
.toast{position:relative;max-width:100%;background:linear-gradient(135deg,#26262e,#1b1b21);color:var(--t);
 border:1px solid var(--l2);font-size:13.5px;font-weight:650;padding:12px 16px;border-radius:14px;
 box-shadow:0 18px 42px -12px #000,0 1px 0 rgba(255,255,255,.07) inset;display:flex;align-items:center;gap:9px;

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

/* ---------- Janelas internas (no lugar de confirm/prompt/select nativo) ---------- */
.appmodal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.55)}
[data-theme="light"] .appmodal{background:rgba(15,23,42,.32)}
.appbox{width:min(430px,100%);max-height:82vh;overflow:auto;background:var(--s1);border:1px solid var(--l2);border-radius:18px;box-shadow:0 26px 70px -18px rgba(0,0,0,.65);padding:18px;color:var(--t)}
.appbox h3{margin:0 0 10px;font-size:17px;line-height:1.25}
.appbox p{margin:0 0 16px;color:var(--m);font-size:14px;line-height:1.45;white-space:pre-line}
.appopt{display:block;width:100%;text-align:left;padding:12px 14px;margin:6px 0;border:1px solid var(--l);border-radius:12px;background:var(--s2);color:var(--t);font:inherit;font-size:15px;cursor:pointer}
.appopt.on{border-color:var(--o);background:linear-gradient(90deg,rgba(255,106,0,.16),transparent);color:var(--o2)}
.appacts{display:flex;gap:10px;margin-top:8px}
.appacts .btn{flex:1}
body.native .top,body.native .back,body.native .side,body.native .sheet,body.native .mfoot{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.native .card,body.native .row,body.native .oc,body.native .btn{transition:none!important;animation:none!important}
body.native .mgrid button,body.native .side button,body.native .btn{transform:none!important}
body.native .msec-anim{animation:msecIn .3s cubic-bezier(.2,.8,.2,1) both!important}
/* No app: cabeçalho fixo e opaco; só a lista abaixo rola */
body.native .top{display:flex!important;position:sticky;top:0;z-index:40;background:var(--s1);border-bottom:1px solid var(--l);padding-top:calc(10px + env(safe-area-inset-top))}
body.native .wrap{padding-top:0}
/* Listas no tema do app, no lugar do seletor cinza do Android */
.selbtn{display:block;width:100%;margin-top:6px;padding:12px 13px;min-height:48px;border-radius:var(--rs);
 border:1px solid var(--l);background:rgba(255,255,255,.04);font-size:15px;color:var(--t);text-align:left;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:none!important}
.selbtn::after{content:"\25BE";float:right;color:var(--m);margin-left:8px}
.selbtn:active{transform:none!important}
[data-theme="light"] .selbtn{background:#fff}
select[style*="display: none"]{display:none!important}
/* Abertura: só a logo sobre o fundo do tema */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#splash.out{display:none}
#splash .spLogo{width:110px;height:110px;border-radius:28px;overflow:hidden}
#splash .spLogo img{width:100%;height:100%;object-fit:cover}</style>

const TOMNOMES=['Padrão','Sino','Ding-Dong','Agudo','Cristal','Alerta','Marimba'];
function avlPararSom(){
  pararSomWeb();
  try{if(window.AVLTheme&&window.AVLTheme.pararSom)window.AVLTheme.pararSom()}catch(e){}
}
let SOMWEB=null,SOMWEB_TIMER=null;
function pararSomWeb(){
  if(SOMWEB_TIMER){clearTimeout(SOMWEB_TIMER);SOMWEB_TIMER=null}
  if(SOMWEB){try{SOMWEB.pause();SOMWEB.currentTime=0}catch(e){}SOMWEB=null}
}
function tocarSomWeb(i,loop){
  pararSomWeb();
  const src=AVL_SONS[Math.max(0,Math.min(6,i|0))];if(!src)return;
  try{
    const a=new Audio(src);a.volume=1;a.loop=!!loop;
    if(loop){SOMWEB=a;SOMWEB_TIMER=setTimeout(pararSomWeb,180000)}
    const q=a.play();if(q&&q.catch)q.catch(()=>{});
  }catch(e){}
}
applyTheme();
if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())document.body.classList.add('native');
try{const _ti=Math.max(0,Math.min(6,+(localStorage.getItem('avl_tom')||0)));if(window.AVLTheme&&window.AVLTheme.setTomPedido)window.AVLTheme.setTomPedido(_ti)}catch(e){}
/* Janelas do app: substituem confirm/prompt e a lista nativa de <select> */
function modalClose(){const m=document.getElementById('appmodal');if(m)m.remove()}
function modalBox(html){
 modalClose();
 const d=document.createElement('div');d.className='appmodal';d.id='appmodal';
 d.innerHTML='<div class="appbox">'+html+'</div>';
 d.addEventListener('click',e=>{if(e.target===d)modalClose()});
 document.body.appendChild(d);
 return d;
}
function askConfirm(msg,txt){
 return new Promise(res=>{
  const d=modalBox('<h3>'+esc(txt||'Confirme')+'</h3><p>'+esc(msg)+'</p><div class="appacts"><button class="btn" data-r="0">Cancelar</button><button class="btn pri" data-r="1">Confirmar</button></div>');
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r=='1';modalClose();res(r)});
 });
}
function askText(msg,val,txt){
 return new Promise(res=>{
  const d=modalBox('<h3>'+esc(txt||'Informe')+'</h3><p>'+esc(msg)+'</p><input id="am_v" value="'+esc(val==null?'':val)+'"><div class="appacts"><button class="btn" data-r="0">Cancelar</button><button class="btn pri" data-r="1">OK</button></div>');
  const inp=document.getElementById('am_v');setTimeout(()=>{inp.focus();inp.select()},30);
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r=='1'?inp.value:null;modalClose();res(r)});
  inp.onkeydown=e=>{if(e.key=='Enter')d.querySelector('[data-r="1"]').click()};
 });
}
/* Listas temáticas: nunca abre o seletor cinza do sistema */
const SELMAP=new Map();let SELID=0;
function chooseOpt(title,os,cb){
 return new Promise(res=>{
  const d=modalBox('<h3>'+esc(title||'Escolher')+'</h3>'+os.map((o,i)=>'<button class="appopt '+(o.on?'on':'')+'" data-i="'+i+'">'+esc(o.t)+'</button>').join(''));
  d.querySelectorAll('.appopt').forEach(b=>b.onclick=()=>{
   const o=os[+b.dataset.i];modalClose();if(cb)cb(o);res(o.v);
  });
 });
}
function selTitle(el){
 const lab=el&&el.closest?el.closest('label'):null;if(!lab)return 'Escolher';
 const t=[...lab.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).filter(Boolean).join(' ');
 return t.replace(/[\s:]+$/g,'')||'Escolher';
}
function pickSel(s,btn){
 if(!s||s.disabled)return;
 const os=[...s.options].map(o=>({v:o.value,t:o.textContent.trim(),on:o.selected}));
 chooseOpt(selTitle(btn||s),os,o=>{
  s.value=o.v;
  s.dispatchEvent(new Event('input',{bubbles:true}));
  s.dispatchEvent(new Event('change',{bubbles:true}));
  if(btn)btn.textContent=o.t;
 });
}
function convertSels(){
 if(!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))return;
 document.querySelectorAll('select:not([data-seldone])').forEach(s=>{
  s.dataset.seldone='1';const id='sl'+(++SELID);SELMAP.set(id,s);
  const b=document.createElement('button');b.type='button';b.className='selbtn';b.dataset.sel=id;
  b.textContent=s.options[s.selectedIndex]?s.options[s.selectedIndex].textContent.trim():'';
  s.parentNode.insertBefore(b,s);s.style.display='none';
 });
}

/* Fecha com animação suave; funciona no painel e no recorte de foto */
function closeBack(b){
 if(!b||b.classList.contains('closing'))return;
 if(!b.classList.contains('open')){if(b.id!=='back')b.remove();return}
 b.style.opacity='';const s=b.querySelector('.sheet');
 if(s){s.style.transition='';s.style.opacity='';s.style.transform=''}
 b.classList.add('closing');b.classList.remove('open');syncMais();
 const done=()=>{b.classList.remove('closing','side-mode');if(b.id!=='back')b.remove();CURO=null};
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}
 const alvo=s||b;
 let fim=false,timer,onend=e=>{if(e&&e.target!==alvo)return;if(fim||!b.classList.contains('closing'))return;
  fim=true;alvo.removeEventListener('animationend',onend);clearTimeout(timer);done()};
 alvo.addEventListener('animationend',onend);timer=setTimeout(onend,460);
}

let ENMAP=null,EAMAP=null,EAEDIT=null,EABLOQ=true;
function enTiles(m){L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m)}
let ENSTORE=null,ENRAD=null;
const lojaIcon=()=>window.L&&L.divIcon({className:'loja-pin',html:'<div style="width:34px;height:34px;border-radius:12px;background:var(--o,#ff6a00);border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10V8l2-4h14l2 4v2"/><path d="M4 10v10h16V10"/><path d="M9 20v-6h6v6"/><path d="M3 10a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/></svg></div>',iconSize:[34,34],iconAnchor:[17,34],tooltipAnchor:[0,-34]});
function lojaValida(lat,lng){const la=+lat,lo=+lng;return Number.isFinite(la)&&Number.isFinite(lo)&&!(la===0&&lo===0)&&lat!=null&&lng!=null&&lat!==''}
function setLojaPin(m,lat,lng,fly){
  if(!window.L||!m)return;
  const p=[+lat,+lng];
  if(ENSTORE){ENSTORE.setLatLng(p)}else{ENSTORE=L.marker(p,{icon:lojaIcon(),zIndexOffset:1000}).addTo(m).bindTooltip('Minha loja',{permanent:true,direction:'top',offset:[0,-30]})}
  updRaio();
  if(fly){try{m.setView(p,Math.max(m.getZoom(),15))}catch(e){}}
}
function updRaio(){
  if(!window.L||!ENMAP)return;
  const la=+$('en_lat')?.value,lo=+$('en_lng')?.value,r=Math.max(0,+$('en_raio')?.value||0);
  const rv=$('en_raio_v'); if(rv) rv.textContent=String(r).replace('.',',');
  if(!lojaValida(la,lo)||!(r>0)){ if(ENRAD){try{ENMAP.removeLayer(ENRAD)}catch(e){}ENRAD=null} return }
  const c=[la,lo];
  if(ENRAD){ENRAD.setLatLng(c);ENRAD.setRadius(r*1000)}
  else ENRAD=L.circle(c,r*1000,{color:'#ff6a00',weight:2,fillColor:'#ff6a00',fillOpacity:.07}).addTo(ENMAP);
}
function enCircles(m){
  if(!window.L||!m)return;
  ENSTORE=null;ENRAD=null;
  const c=[+ENT.lat||0,+ENT.lng||0];
  const hasLoja=lojaValida(ENT.lat,ENT.lng);
  if(hasLoja) setLojaPin(m,c[0],c[1]);
  else if(+ENT.raio>0 && lojaValida(c[0],c[1])) ENRAD=L.circle(c,+ENT.raio*1000,{color:'#ff6a00',weight:2,fillColor:'#ff6a00',fillOpacity:.07}).addTo(m);
  updRaio();
  (ENT.areas||[]).forEach(a=>{
    const ac=[+a.lat||0,+a.lng||0],cor=a.bloqueado?'#ff5d52':'#34d399';
    L.circle(ac,Math.max(.1,+a.raio||1)*1000,{color:cor,weight:2,fillColor:cor,fillOpacity:.1}).addTo(m).bindTooltip(a.nome,{permanent:true,direction:'top'});
    L.marker(ac).addTo(m).on('click',()=>enSheet(String(a.id)));
  });
}
function initEntMap(){
  if(ENMAP){try{ENMAP.remove()}catch(e){}ENMAP=null}
  ENSTORE=null;ENRAD=null;
  if(!window.L||tab!='entregas'||!$('en_map'))return;
  const la=+$('en_lat')?.value||+ENT.lat, lo=+$('en_lng')?.value||+ENT.lng;
  const has=lojaValida(la,lo);
  ENMAP=L.map('en_map',{scrollWheelZoom:false,zoomControl:true}).setView(has?[la,lo]:[-22.8808,-43.1940],has?15:13);
  enTiles(ENMAP);enCircles(ENMAP);
  ENMAP.on('click',e=>{const la=e.latlng.lat.toFixed(6),lo=e.latlng.lng.toFixed(6);$('en_lat').value=la;$('en_lng').value=lo;ENT.lat=+la;ENT.lng=+lo;setLojaPin(ENMAP,la,lo,true);saveEnt('Ponto da loja salvo');});
  const rr=$('en_raio');if(rr)rr.addEventListener('input',updRaio);
  setTimeout(()=>{try{ENMAP.invalidateSize()}catch(e){}},140);

function initEaMap(){
  if(EAMAP){try{EAMAP.remove()}catch(e){}EAMAP=null}
  if(!window.L||!$('ea_map'))return;
  const la=+$('ea_lat').value||+ENT.lat||-22.8808,lo=+$('ea_lng').value||+ENT.lng||-43.1940;
  EAMAP=L.map('ea_map',{scrollWheelZoom:false,zoomControl:false}).setView([la,lo],14);
  enTiles(EAMAP);
  const mk=L.marker([la,lo]).addTo(EAMAP);
  const put=(a,b,fly)=>{$('ea_lat').value=(+a).toFixed(6);$('ea_lng').value=(+b).toFixed(6);mk.setLatLng([a,b]);
    const rr=Math.max(.1,+$('ea_r').value||1); const rv=$('ea_r_v'); if(rv) rv.textContent=String(rr).replace('.',',');
    if(EAMAP._c)EAMAP.removeLayer(EAMAP._c);
    const cor=EABLOQ?'#ff5d52':'#34d399';
    EAMAP._c=L.circle([a,b],rr*1000,{color:cor,weight:2,fillColor:cor,fillOpacity:.1}).addTo(EAMAP);
    if(fly)try{EAMAP.flyTo([a,b],15)}catch(e){}};
  EAMAP._put=put;put(la,lo);
  EAMAP.on('click',e=>put(e.latlng.lat,e.latlng.lng));
  $('ea_r').addEventListener('input',()=>put(+$('ea_lat').value||0,+$('ea_lng').value||0));
  setTimeout(()=>{try{EAMAP.invalidateSize()}catch(e){}},140);
}
async function eaBusca(){
  const q=$('ea_n')&&$('ea_n').value.trim();if(!q)return toast('Digite o nome do bairro');
  const btn=document.querySelector('[data-a="eabusca"]');if(btn){btn.disabled=true;btn.textContent='Buscando...'}
  try{
    const la=+$('en_lat')?.value||+ENT.lat||-22.8808,lo=+$('en_lng')?.value||+ENT.lng||-43.1940;
    const base='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&addressdetails=1';
    const qs=[base+'&viewbox='+(lo-.8)+','+(la+.8)+','+(lo+.8)+','+(la-.8)+'&bounded=0&q='+encodeURIComponent(q),
              base+'&q='+encodeURIComponent(q+', Brasil')];
    let it=null,netErr=false;
    for(const u of qs){ try{ const r=await fetch(u,{headers:{'Accept':'application/json'}}); if(!r.ok){netErr=true;continue} const j=await r.json(); if(j&&j[0]){it=j[0];break} }catch(e){netErr=true} }
    if(!it){ if(netErr) return toast('Sem conexão para buscar. Verifique a internet.'); return toast('Bairro não encontrado. Tente incluir a cidade.'); }
    if(EAMAP&&EAMAP._put)EAMAP._put(+it.lat,+it.lon,true);
    const a=it.address||{},nome=a.suburb||a.neighbourhood||a.quarter||a.city_district||q;
    if($('ea_n')&&($('ea_n').value.trim()==q||!$('ea_n').value.trim()))$('ea_n').value=String(nome).slice(0,40);
    toast('Local encontrado no mapa','ok');
  }catch(e){toast('Não foi possível buscar o bairro')}

}

<script>
/* Trava a rolagem do fundo enquanto houver uma tela aberta (sacola, item, Pix, painel) */
(function () {
  var SEL = '.page.open,.sheet-back.open,.back.open,body.side-open', b = document.body, h = document.documentElement, on = false, y = 0, sy = 0;
  function sync() {
    var any = !!document.querySelector(SEL);
    if (any && !on) {
      on = true; y = window.pageYOffset || h.scrollTop || 0;
      var sw = window.innerWidth - h.clientWidth;
      b.style.top = -y + 'px'; if (sw > 0) b.style.paddingRight = sw + 'px';
      b.classList.add('locked'); h.classList.add('locked');
    } else if (!any && on) {
      on = false; b.classList.remove('locked'); h.classList.remove('locked');
      b.style.top = ''; b.style.paddingRight = '';
      window.scrollTo({ top: y, left: 0, behavior: 'instant' });
    }
  }
  new MutationObserver(sync).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
  document.addEventListener('touchstart', function (e) { sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (e.target && e.target.closest && e.target.closest('input[type=range],input,select,textarea')) return;
    if (!on || e.touches.length > 1) return;
    var n = e.target;
    while (n && n !== b && n !== h) {
      if (n.nodeType === 1 && n.scrollHeight > n.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(n).overflowY)) break;
      n = n.parentNode;
    }
    if (!n || n === b || n === h) return e.preventDefault();
    var dy = e.touches[0].clientY - sy;
    if ((dy > 0 && n.scrollTop <= 0) || (dy < 0 && n.scrollTop + n.clientHeight >= n.scrollHeight - 1)) e.preventDefault();
  }, { passive: false });
  sync();
})();
</script>
